<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- 小尺寸图标（16～32px，托盘和任务栏用）：去掉细节，只留底板和四块磁贴，对齐像素格 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <rect x="3" y="3" width="4" height="4" rx="1" fill="#FFFFFF"/>
  <rect x="9" y="3" width="4" height="4" rx="1" fill="#FFFFFF" fill-opacity="0.82"/>
  <rect x="3" y="9" width="4" height="4" rx="1" fill="#FFFFFF" fill-opacity="0.82"/>
  <rect x="9" y="9" width="4" height="2" rx="1" fill="#FFFFFF"/>
</svg>
