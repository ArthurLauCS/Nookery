<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 应用图标（40px 及以上）：四块分开的蓝色磁贴，左上一块有标题栏和两个文件，右下一块折叠成只剩标题栏 -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="240" y2="240">
      <stop offset="0" stop-color="#7DB8FF"/>
      <stop offset="0.5" stop-color="#2F6FEB"/>
      <stop offset="1" stop-color="#1D46B8"/>
    </linearGradient>
  </defs>
  <g fill="url(#bg)">
    <rect x="16" y="16" width="104" height="104" rx="22"/>
    <rect x="136" y="16" width="104" height="104" rx="22"/>
    <rect x="16" y="136" width="104" height="104" rx="22"/>
    <rect x="136" y="136" width="104" height="40" rx="20"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="36" y="32" width="64" height="12" rx="6" fill-opacity="0.6"/>
    <rect x="36" y="58" width="28" height="40" rx="6"/>
    <rect x="72" y="58" width="28" height="40" rx="6" fill-opacity="0.6"/>
  </g>
  <path d="M174 150 l14 12 l14 -12" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
