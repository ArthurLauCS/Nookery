<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 应用图标（40px 及以上）：渐变底板上四块磁贴，右下一块折叠成只剩标题栏 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#gloss)"/>
  <g filter="url(#sh)">
    <!-- 左上：展开的磁贴，标题栏 + 两个文件 -->
    <rect x="44" y="44" width="78" height="78" rx="16" fill="#FFFFFF"/>
    <rect x="44" y="44" width="78" height="22" rx="11" fill="#C7D2FE"/>
    <rect x="44" y="55" width="78" height="11" fill="#C7D2FE"/>
    <rect x="56" y="78" width="22" height="30" rx="5" fill="#3B82F6"/>
    <rect x="88" y="78" width="22" height="30" rx="5" fill="#2DD4BF"/>
    <!-- 右上、左下：普通磁贴 -->
    <rect x="134" y="44" width="78" height="78" rx="16" fill="#FFFFFF" fill-opacity="0.82"/>
    <rect x="44" y="134" width="78" height="78" rx="16" fill="#FFFFFF" fill-opacity="0.82"/>
    <!-- 右下：折叠起来只剩标题栏 -->
    <rect x="134" y="134" width="78" height="24" rx="12" fill="#FFFFFF"/>
    <path d="M165 143 l8 7 l8 -7" fill="none" stroke="#6D28D9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
